name: Fuse CI & Deployment Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # 1. VALIDATION & SECURITY (Runs on all branches & Pull Requests)
  # =========================================================================
  validate:
    name: Lint, Test & Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint aws-sam-cli moto boto3

      - name: Gitleaks Secret Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CloudFormation & SAM Template Linting
        run: |
          cfn-lint infra/cloudformation/fuse-cross-account-role.yaml
          cfn-lint template.yaml
          sam validate --lint

      - name: IAM Policy & Coverage Static Verification
        run: python scripts/check_iam_coverage.py

      - name: Run Unit Test Suite
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: SAM Build
        run: sam build

  # =========================================================================
  # 2. DEPLOY BACKEND (Requires main branch + manual approval in 'production')
  # =========================================================================
  deploy-backend:
    name: Deploy Backend Infrastructure
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: SAM Build
        run: sam build

      - name: SAM Deploy to AWS
        run: |
          sam deploy \
            --stack-name fuse-sam \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  # =========================================================================
  # 3. DEPLOY FRONTEND (Requires main branch + manual approval in 'production')
  # =========================================================================
  deploy-frontend:
    name: Deploy Frontend to Amplify
    needs: [validate, deploy-backend]
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install Boto3
        run: pip install boto3

      - name: Package and Deploy to AWS Amplify
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID || 'd1hndpgpwb40h8' }}
          CONTROL_API_BASE: ${{ secrets.CONTROL_API_BASE }}
          API_KEY: ${{ secrets.API_KEY }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
        run: python scripts/deploy_amplify.py
