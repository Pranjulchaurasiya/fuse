name: Deploy Fuse Fullstack (Frontend & Backend)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # 1. DEPLOY BACKEND (AWS Lambda, WAF, DynamoDB, API Gateway via SAM)
  # =========================================================================
  deploy-backend:
    name: Deploy Backend Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: SAM Build
        run: sam build

      - name: SAM Deploy to AWS
        run: |
          sam deploy \
            --stack-name fuse-sam \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  # =========================================================================
  # 2. DEPLOY FRONTEND (AWS Amplify Hosting Edge CDN)
  # =========================================================================
  deploy-frontend:
    name: Deploy Frontend to Amplify
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install Boto3
        run: pip install boto3

      - name: Package and Deploy to AWS Amplify
        run: python scripts/deploy_amplify.py
