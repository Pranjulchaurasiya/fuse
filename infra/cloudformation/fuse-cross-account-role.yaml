AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Fuse Cost Guardrail — Cross-Account Access Role.
  Deploy this once in your AWS account to connect Fuse.
  Fuse will use this role to read your CloudWatch metrics
  and write WAFv2 IP blocks. No credentials are shared.

Parameters:
  FuseAccountId:
    Type: String
    Default: '515903395012'
    Description: The Fuse SaaS Control Plane AWS Account ID that is authorized to assume this role.

  FuseExternalId:
    Type: String
    Description: Unique External ID provided by Fuse during onboarding. Do not share this.

  CustomerApiGatewayId:
    Type: String
    Default: ''
    Description: Optional REST API ID of the API Gateway you want Fuse to protect. Leave empty if managing WAF independently without API Gateway stage association.

  CustomerApiStage:
    Type: String
    Default: prod
    Description: The stage name (e.g. prod, staging).

Conditions:
  HasApiGatewayId: !Not [!Equals [!Ref CustomerApiGatewayId, '']]

Resources:
  FuseAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fuse-guardrail-access
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${FuseAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref FuseExternalId
      Policies:
        - PolicyName: fuse-base-monitoring-and-waf
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchReadMetrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Sid: CloudWatchLogsRead
                Effect: Allow
                Action:
                  - logs:FilterLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: '*'
              - Sid: WAFv2ListOperations
                Effect: Allow
                Action:
                  - wafv2:ListIPSets
                  - wafv2:ListWebACLs
                Resource: '*'
              - Sid: WAFv2IPSetManagement
                Effect: Allow
                Action:
                  - wafv2:GetIPSet
                  - wafv2:UpdateIPSet
                  - wafv2:CreateIPSet
                Resource:
                  - !Sub 'arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/ipset/fuse-blocked-ips/*'
                  - !Sub 'arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/ipset/*'
              - Sid: WAFv2WebACLManagement
                Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:GetWebACL
                  - wafv2:UpdateWebACL
                Resource:
                  - !Sub 'arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/fuse-guardrail-acl/*'
                  - !Sub 'arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/*'

  FuseApiGatewayAccessPolicy:
    Type: AWS::IAM::Policy
    Condition: HasApiGatewayId
    Properties:
      PolicyName: fuse-apigateway-scoped-access
      Roles:
        - !Ref FuseAccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: APIGatewayScopedRead
            Effect: Allow
            Action:
              - apigateway:GET
            Resource:
              - !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${CustomerApiGatewayId}*'
          - Sid: WAFv2AssociateStage
            Effect: Allow
            Action:
              - wafv2:AssociateWebACL
            Resource:
              - !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${CustomerApiGatewayId}/stages/${CustomerApiStage}'
              - !Sub 'arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/*'

Outputs:
  FuseRoleArn:
    Description: Copy this ARN and paste it into Fuse onboarding to complete setup.
    Value: !GetAtt FuseAccessRole.Arn
  ExternalId:
    Description: Your External ID (already set — do not change).
    Value: !Ref FuseExternalId
